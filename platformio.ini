; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
test_ignore = *
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --std=c++17 --inline-suppr --suppress=unusedFunction

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<alarm_logic.cpp>
    +<display_mode.cpp>
    +<system_state.cpp>